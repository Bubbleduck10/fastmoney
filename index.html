<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastMoney</title>
<meta name="description" content="send $5 to mint">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Everything on this page is static markup on purpose. The centre mark is a
     real QR rendered as inline SVG rather than drawn at runtime, so it still
     shows up in a preview pane, an email client or anything else that does not
     execute scripts. Regenerate it with: node tools/make-qr.mjs <handle> */
  :root {
    --bg: #f8f8f6;
    --ink: #1a1a18;
    --muted: #6f6f69;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Geist, "Geist Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  a { color: inherit; text-decoration: none; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 34px;
  }

  .wordmark {
    font-family: "Times New Roman", Times, serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .nav {
    font-size: 13px;
    letter-spacing: 0.18em;
    transition: opacity 140ms ease;
  }
  .nav:hover { opacity: 0.55; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px 6vh;
  }

  .mark {
    width: min(248px, 60vw);
    aspect-ratio: 1;
  }
  .mark svg { width: 100%; height: 100%; display: block; }

  .mint {
    margin: clamp(52px, 10vh, 96px) 0 0;
    font-size: 13px;
    letter-spacing: 0.025em;
    color: var(--muted);
    text-align: center;
  }
  .mint a { color: var(--ink); transition: opacity 140ms ease; }
  .mint a:hover { opacity: 0.55; }

  .connect {
    margin-top: clamp(38px, 7vh, 60px);
    font-size: 13px;
    letter-spacing: 0.18em;
    padding: 6px 4px;
    transition: opacity 140ms ease;
  }
  .connect:hover { opacity: 0.55; }
  .connect:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }

  @media (max-width: 480px) {
    header { padding: 22px 20px; }
    .wordmark { font-size: 24px; }
  }
</style>
</head>
